<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NVA Avatar Player</title>
<style>
  :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172033;background:#f5f6f8}
  *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}
  header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #e4e7ec;background:#fff}
  .brand{font-weight:750;letter-spacing:-.02em}.version{font-size:12px;color:#667085;background:#f2f4f7;border-radius:99px;padding:5px 9px}
  .layout{max-width:1180px;margin:auto;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}
  .stage-card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 2px 8px #1018280a}
  .stage-card{padding:18px}.stage{min-height:620px;display:grid;place-items:center;overflow:hidden;border-radius:12px;background:#e9edf3 center/cover no-repeat;transition:background-color .2s}
  .media{display:block;max-width:100%;max-height:620px;filter:drop-shadow(0 18px 24px #10182824)}
  .panel{padding:20px;align-self:start}.panel h1{font-size:20px;margin:0 0 6px}.sub{font-size:13px;color:#667085;margin:0 0 20px;line-height:1.5}
  label{display:block;font-size:12px;font-weight:650;color:#475467;margin:14px 0 6px}input,select,button{width:100%}
  input[type=file],select{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px;color:#344054}
  button{margin-top:10px;border:0;border-radius:9px;padding:10px 12px;background:#6d5ce7;color:#fff;font-weight:650;cursor:pointer}button.secondary{background:#f2f4f7;color:#344054}button:disabled{opacity:.45;cursor:default}
  .section{padding-top:12px;margin-top:16px;border-top:1px solid #eaecf0}.background-row{display:grid;grid-template-columns:52px 1fr;gap:8px}.background-row input{height:40px;border:1px solid #d0d5dd;border-radius:9px;padding:3px;background:#fff}
  .badge{display:inline-block;border-radius:999px;background:#26344b;color:#bcd0ee;padding:3px 9px;font-size:11px;margin-top:10px}.badge.aligned{background:#123d31;color:#72e5bd}.badge.approximate{background:#4a3414;color:#ffd384}
  #status{font-size:12px;line-height:1.5;color:#475467;background:#f8f9fb;border-radius:9px;padding:10px;margin-top:16px;min-height:54px}
  @media(max-width:820px){header{padding:0 18px}.layout{grid-template-columns:1fr;padding:16px}.panel{grid-row:1}.stage{min-height:460px}.media{max-height:460px}}
</style>
</head>
<body>
<header><div class="brand">NVA Player</div><div class="version">NVA v0.3</div></header>
<div class="layout">
<section class="stage-card">
  <div id="stage" class="stage">
    <video id="animation" class="media" playsinline></video>
    <canvas id="stageCanvas" width="720" height="1280" class="media" style="display:none"></canvas>
    <audio id="speechAudio" style="display:none"></audio>
    <video id="bodyVideo" muted playsinline style="display:none"></video>
    <video id="speechVideoA" muted playsinline style="display:none"></video>
    <video id="speechVideoB" muted playsinline style="display:none"></video>
  </div>
</section>
<aside class="panel">
  <h1>NVA Avatar Player</h1>
  <p class="sub">Open a finished avatar and preview its packaged speech and actions.</p>
  <label for="nvaFile">NVA file</label>
  <input id="nvaFile" type="file" accept=".nva,.zip,application/zip">
  <label for="sample">Packaged samples</label>
  <select id="sample" disabled><option value="">Loading sample catalog…</option></select>
  <button id="loadSample" class="secondary" disabled>Open selected sample</button>

  <div class="section">
    <label for="backgroundColor">Preview background</label>
    <div class="background-row">
      <input id="backgroundColor" type="color" value="#e9edf3" aria-label="Background color">
      <input id="backgroundImage" type="file" accept="image/*" aria-label="Background image">
    </div>
    <button id="clearBackground" class="secondary" type="button">Clear background image</button>
  </div>

  <div class="section">
    <label for="speechClip">Pre-rendered speech video</label>
    <select id="speechClip" disabled><option value="">No speech videos loaded</option></select>
    <button id="playSpeech" disabled>Play packaged speech</button>
    <button id="playTalking" class="secondary" disabled>Play talking loop</button>
  </div>
  <div class="section">
    <label for="action">NVA action</label>
    <select id="action" disabled><option value="">No actions loaded</option></select>
    <button id="playAction" class="secondary" disabled>Play action</button>
  </div>
  <div id="speechMotionSection" class="section" style="display:none">
    <label for="audioFile">Audio</label>
    <input id="audioFile" type="file" accept="audio/*">
    <label for="planFile">SpeechPlan v1</label>
    <input id="planFile" type="file" accept=".json,application/json">
    <div id="quality" class="badge" style="display:none">not loaded</div>
    <button id="playComposed" disabled>Play composed speech</button>
    <button id="stopComposed" class="secondary" disabled>Stop composed speech</button>
  </div>
  <button id="stop" class="secondary" disabled>Stop and return to idle</button>
  <div id="status">Choose an NVA avatar.</div>
</aside>
</div>
<script type="module">
import { LoadCoordinator } from "./load-coordinator.js";
import { loadNvaBundle } from "./nva-bundle-loader.js";
import { NvaAnimationPlayer } from "./nva-animation-player.js";
import { StageBackground } from "./stage-background.js";
import { fetchNvaSample, loadSampleCatalog } from "./sample-catalog.js";
import { SpeechPlayer } from "./speech-player.js";

const get = (id) => document.getElementById(id);
const avatarLoads = new LoadCoordinator();
let bundle = null;
let animationPlayer = null;
let player = null;
let preComposedSnapshot = null;
let composedPlayActive = false;
let composedSession = 0;
let playRequest = 0;
const stageBackground = new StageBackground(get("stage"));

function setStatus(message, error = false) {
  get("status").textContent = message;
  get("status").style.color = error ? "#ff8d8d" : "#aebbd0";
}

function selectOptions(items, emptyText) {
  if (!items.length) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = emptyText;
    return [option];
  }
  return items.map((item) => {
    const option = document.createElement("option");
    option.value = item.key;
    option.textContent = item.label;
    return option;
  });
}

async function restoreIdle(message = "Idle restored.", request = undefined, isError = false) {
  await animationPlayer?.playIdle();
  if (request !== undefined && request !== playRequest) return;
  setStatus(message, isError);
}

function takeAnimationPlayerSnapshot() {
  const video = get("animation");
  return {
    state: animationPlayer?.state,
    src: video.src,
    currentTime: video.currentTime,
    loop: video.loop,
    muted: video.muted,
    paused: video.paused,
    backgroundColor: get("backgroundColor").value,
    stageBgColor: get("stage").style.backgroundColor,
    stageBgImage: get("stage").style.backgroundImage,
  };
}

function restoreFromSnapshot(snapshot) {
  if (!snapshot) return;
  const video = get("animation");
  const canvas = get("stageCanvas");

  canvas.style.display = "none";
  video.style.display = "";

  if (animationPlayer) {
    animationPlayer.state = snapshot.state;
  }
  video.loop = snapshot.loop;
  video.muted = snapshot.muted;
  if (snapshot.src && video.src !== snapshot.src) {
    video.src = snapshot.src;
  }
  video.currentTime = snapshot.currentTime;
  if (!snapshot.paused) {
    video.play().catch(() => {});
  } else {
    video.pause();
  }

  if (snapshot.stageBgColor !== undefined) get("stage").style.backgroundColor = snapshot.stageBgColor;
  if (snapshot.stageBgImage !== undefined) get("stage").style.backgroundImage = snapshot.stageBgImage;

  window.__lastRestore = {
    state: animationPlayer?.state,
    src: video.src,
    currentTime: video.currentTime,
    paused: video.paused,
    loop: video.loop,
    muted: video.muted,
    stageBgColor: get("stage").style.backgroundColor,
    stageBgImage: get("stage").style.backgroundImage,
  };
}

async function openNva(loadSource, label) {
  const request = ++playRequest;
  const { generation, signal } = avatarLoads.begin();
  player?.stop("cancel");
  player?.dispose();
  player = null;
  preComposedSnapshot = null;
  composedPlayActive = false;
  get("stageCanvas").style.display = "none";
  get("animation").style.display = "";
  get("speechMotionSection").style.display = "none";

  get("playSpeech").disabled = true;
  get("playAction").disabled = true;
  get("playTalking").disabled = true;
  get("speechClip").disabled = true;
  get("action").disabled = true;
  get("stop").disabled = true;
  setStatus(`Loading ${label}…`);
  try {
    animationPlayer?.stop();
    const file = await loadSource(signal);
    if (!avatarLoads.isCurrent(generation)) return;
    const loadedBundle = await loadNvaBundle(file);
    if (!avatarLoads.isCurrent(generation)) return;
    animationPlayer?.dispose();
    animationPlayer = new NvaAnimationPlayer(get("animation"));
    bundle = loadedBundle;
    const loaded = await animationPlayer.load(loadedBundle);
    if (!avatarLoads.isCurrent(generation)) return;
    await animationPlayer.playIdle().catch(() => {});
    get("animation").style.aspectRatio = `${bundle.manifest.canvas.width}/${bundle.manifest.canvas.height}`;

    get("speechClip").replaceChildren(...selectOptions(loaded.speechClips, "No packaged speech videos"));
    get("speechClip").disabled = !loaded.speechClips.length;
    get("playSpeech").disabled = !loaded.speechClips.length;
    get("action").replaceChildren(...selectOptions(loaded.actions, "No actions in this NVA"));
    get("action").disabled = !loaded.actions.length;
    get("playAction").disabled = !loaded.actions.length;
    get("playTalking").disabled = !loaded.talking;
    get("stop").disabled = false;

    if (bundle.manifest?.speech_motion) {
      get("speechMotionSection").style.display = "";
      get("audioFile").value = "";
      get("planFile").value = "";
      get("playComposed").disabled = true;
      get("stopComposed").disabled = true;
      get("quality").style.display = "none";
    }

    const avatarName = bundle.manifest.meta?.name || label;
    setStatus(`Ready · ${avatarName} · ${loaded.speechClips.length} packaged speech videos · ${loaded.actions.length} actions`);
  } catch (error) {
    if (avatarLoads.isCurrent(generation) && error.name !== "AbortError") {
      animationPlayer?.dispose();
      animationPlayer = null;
      bundle = null;
      get("speechMotionSection").style.display = "none";
      get("speechClip").replaceChildren(...selectOptions([], "No speech videos loaded"));
      get("action").replaceChildren(...selectOptions([], "No actions loaded"));
      setStatus(`Blocked: ${error.message}`, true);
    }
  }
}

async function prepareSpeechPlayer() {
  if (!get("audioFile").files[0] || !get("planFile").files[0] || !bundle?.manifest?.speech_motion) return;
  if (composedPlayActive) {
    clearSpeechMonitor();
    player?.stop("cancel");
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
    composedPlayActive = false;
  }
  get("playComposed").disabled = true;
  get("stopComposed").disabled = true;
  setStatus("Validating bundle, atlas, audio, and SpeechPlan…");
  try {
    const plan = JSON.parse(await get("planFile").files[0].text());
    player?.stop("cancel");
    player?.dispose();
    player = new SpeechPlayer({
      audio: get("speechAudio"),
      canvas: get("stageCanvas"),
      bodyVideo: get("bodyVideo"),
      speechVideos: [get("speechVideoA"), get("speechVideoB")],
    });
    const result = await player.load({
      manifest: bundle.manifest,
      assets: bundle.assets,
      plan,
      audioBlob: get("audioFile").files[0],
    });
    get("quality").className = `badge ${result.quality_mode}`;
    get("quality").textContent = result.quality_mode === "aligned" ? "aligned quality path" : "approximate preview";
    get("quality").style.display = "";
    get("playComposed").disabled = false;
    get("stopComposed").disabled = false;
    setStatus(`Ready · composed speech ready (${result.transitions} transitions) · no GPU/model runtime`);
  } catch (error) {
    player?.stop("cancel");
    player?.dispose();
    player = null;
    get("quality").style.display = "none";
    setStatus(`Blocked: ${error.message}`, true);
  }
}

get("nvaFile").addEventListener("change", () => {
  const file = get("nvaFile").files[0];
  if (file) void openNva(async () => file, file.name);
});
get("loadSample").addEventListener("click", () => {
  const option = get("sample").selectedOptions[0];
  if (option?.value) void openNva((signal) => fetchNvaSample(option.value, { signal }), option.textContent);
});
get("audioFile").addEventListener("change", prepareSpeechPlayer);
get("planFile").addEventListener("change", prepareSpeechPlayer);

get("playSpeech").addEventListener("click", async () => {
  if (composedPlayActive) {
    clearSpeechMonitor();
    player?.stop("cancel");
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
    composedPlayActive = false;
  }
  const request = ++playRequest;
  try {
    await animationPlayer.playSpeech(get("speechClip").value);
    if (request !== playRequest) return;
    setStatus(`Playing packaged speech: ${get("speechClip").selectedOptions[0].textContent}`);
  } catch (error) {
    if (request !== playRequest) return;
    await restoreIdle(`Speech video failed: ${error.message}`, request, true);
  }
});
get("playTalking").addEventListener("click", async () => {
  if (composedPlayActive) {
    clearSpeechMonitor();
    player?.stop("cancel");
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
    composedPlayActive = false;
  }
  const request = ++playRequest;
  try {
    await animationPlayer.playTalking();
    if (request !== playRequest) return;
    setStatus("Playing talking loop.");
  } catch (error) {
    if (request !== playRequest) return;
    await restoreIdle("Talking failed: " + error.message, request, true);
  }
});
get("playAction").addEventListener("click", async () => {
  if (composedPlayActive) {
    clearSpeechMonitor();
    player?.stop("cancel");
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
    composedPlayActive = false;
  }
  const request = ++playRequest;
  try {
    await animationPlayer.playAction(get("action").value);
    if (request !== playRequest) return;
    setStatus(`Playing action: ${get("action").selectedOptions[0].textContent}`);
  } catch (error) {
    if (request !== playRequest) return;
    await restoreIdle(`Action failed: ${error.message}`, request, true);
  }
});

let speechMonitorTimer = null;

function clearSpeechMonitor() {
  if (speechMonitorTimer !== null) {
    clearInterval(speechMonitorTimer);
    speechMonitorTimer = null;
  }
}

function startSpeechMonitor() {
  clearSpeechMonitor();
  speechMonitorTimer = setInterval(() => {
    if (!composedPlayActive) {
      clearSpeechMonitor();
      return;
    }
    if (player && player.state !== "speaking") {
      clearSpeechMonitor();
      player?.stop("error");
      restoreFromSnapshot(preComposedSnapshot);
      preComposedSnapshot = null;
      composedPlayActive = false;
      setStatus("Playback failed: speech asset error", true);
    }
  }, 20);
}

get("playComposed").addEventListener("click", async () => {
  if (!player) return;
  if (composedPlayActive) {
    clearSpeechMonitor();
    player?.stop("cancel");
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
    composedPlayActive = false;
    setStatus("Interrupted; original ready state restored.");
    return;
  }
  preComposedSnapshot = takeAnimationPlayerSnapshot();
  get("animation").pause();
  get("animation").style.display = "none";
  get("stageCanvas").style.display = "";
  composedPlayActive = true;
  const session = ++composedSession;
  try {
    await player.play();
    if (session !== composedSession || !composedPlayActive) {
      // Stopped or interrupted while play() was pending: that path already restored.
      if (!composedPlayActive) player?.stop("cancel");
      return;
    }
    startSpeechMonitor();
    setStatus("Playing from the audio clock.");
  } catch (error) {
    if (session !== composedSession || !composedPlayActive) return;
    clearSpeechMonitor();
    player?.stop("cancel");
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
    composedPlayActive = false;
    setStatus(`Playback failed: ${error.message}`, true);
  }
});

get("stopComposed").addEventListener("click", () => {
  clearSpeechMonitor();
  player?.stop("cancel");
  if (preComposedSnapshot) {
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
  }
  composedPlayActive = false;
  setStatus("Stopped; original ready state restored.");
});

get("speechAudio").addEventListener("ended", () => {
  clearSpeechMonitor();
  if (composedPlayActive) {
    player?.stop("complete");
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
    composedPlayActive = false;
    setStatus("Playback complete; idle restored.");
  }
});
get("speechAudio").addEventListener("error", () => {
  clearSpeechMonitor();
  if (composedPlayActive) {
    player?.stop("error");
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
    composedPlayActive = false;
    setStatus("Playback failed: audio error", true);
  }
});

get("stop").addEventListener("click", async () => {
  clearSpeechMonitor();
  if (composedPlayActive) {
    player?.stop("cancel");
    restoreFromSnapshot(preComposedSnapshot);
    preComposedSnapshot = null;
    composedPlayActive = false;
  }
  const request = ++playRequest;
  await animationPlayer?.playIdle();
  if (request === playRequest) setStatus("Stopped; idle restored.");
});
get("backgroundColor").addEventListener("input", () => { stageBackground.setColor(get("backgroundColor").value); });
get("backgroundImage").addEventListener("change", () => {
  const image = get("backgroundImage").files[0];
  if (!image) return;
  try { stageBackground.setImage(image); } catch (error) { setStatus(error.message, true); }
});
get("clearBackground").addEventListener("click", () => {
  get("backgroundImage").value = "";
  stageBackground.setColor(get("backgroundColor").value);
});
get("animation").addEventListener("ended", () => {
  if (["action", "speech"].includes(animationPlayer?.state)) void restoreIdle("Playback complete; idle restored.");
});

async function prepareSampleCatalog() {
  const catalogUrl = new URLSearchParams(location.search).get("catalog")
    || new URL("../../examples/catalog.json", location.href).href;
  try {
    const samples = await loadSampleCatalog(catalogUrl);
    get("sample").replaceChildren(...samples.map((sample) => {
      const option = document.createElement("option");
      option.value = sample.url;
      option.textContent = sample.label;
      return option;
    }));
    get("sample").disabled = !samples.length;
    get("loadSample").disabled = !samples.length;
  } catch (error) {
    get("sample").replaceChildren(...selectOptions([], "Samples unavailable — use file picker"));
    setStatus(`Sample catalog blocked: ${error.message}. You can still open a local file.`, true);
  }
}

void prepareSampleCatalog();
window.addEventListener("beforeunload", () => {
  clearSpeechMonitor();
  avatarLoads.cancel();
  animationPlayer?.dispose();
  player?.stop("cancel");
  player?.dispose();
  stageBackground.dispose();
});

// Test inspection hooks
window.__animationPlayer = () => animationPlayer;
window.__player = () => player;
window.__getSnapshot = () => preComposedSnapshot;
window.__takeSnapshot = takeAnimationPlayerSnapshot;
window.__restoreSnapshot = restoreFromSnapshot;
</script>
</body>
</html>
